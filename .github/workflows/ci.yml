name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: |
          cd backend/worker
          npm ci
          npx tsc --noEmit
          npx vitest run

  app:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Run tests
        run: |
          cd app
          flutter pub get
          flutter analyze
          flutter test test/usage test/rooms test/logging
